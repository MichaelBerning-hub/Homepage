<style>

:root{

}
@media (prefers-color-scheme: dark){

*{box-sizing:border-box}

p{margin:0}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.note{background:var(--signal-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.hidden{display:none !important}

.flash{min-height:250px;justify-content:center;align-items:center;text-align:center;gap:14px}

.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}

td .bar{width:70px;display:inline-block;vertical-align:middle;margin-right:6px}

.opt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:50;max-width:90%}
.q{display:flex;flex-direction:column;gap:8px}

.q .opts button.no{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}

.demo{max-width:780px;margin:0 auto;padding:6px 16px;font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.demo a{color:var(--accent);font-weight:700}
</style>

function aiErr(e){ if(e && e.code === "not_granted"){ aiState = "off"; return "Die KI-Funktion wurde nicht freigegeben."; } if(e && e.code === "rate_limited") return "Gerade zu viele Anfragen. Bitte in einer Minute noch einmal versuchen."; if(e && e.code === "off") return "Die KI ist in dieser Ansicht nicht verfügbar."; return "Das hat nicht geklappt. Bitte noch einmal versuchen."; }
function md(t){
  const lines = esc(t).split("\n"); let out = "", inList = false;
  for(let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    if(/^\s*[-•*]\s+/.test(l)){ if(!inList){ out += "<ul>"; inList = true; } out += "<li>" + l.replace(/^\s*[-•*]\s+/,"") + "</li>"; continue; }
    if(inList){ out += "</ul>"; inList = false; }
    if(/^#{1,4}\s/.test(l)) out += "<h4>" + l.replace(/^#{1,4}\s/,"") + "</h4>";
    else if(l.trim()) out += "<p>" + l + "</p>";
  }
  if(inList) out += "</ul>";
  return out;
}

      ${ui.tr[hi] || !CAN_SPEAK ? `<div class="text-src">${esc(h.text)}</div>` : ""}
      ${h.q.map((q,i) => quiz("H"+hi+"_"+i, q, "mc")).join("")}
      ${scoreLine("H"+hi+"_", h.q, "mc", "hoeren")}</section>`).join("");
  } else if(ui.part === "schreiben"){
    const wt = WRITE[ui.wTask];
    body = `<section class="card"><span class="eyebrow">Schreiben</span><h2>Wählen Sie eine Aufgabe</h2>
      <div class="chips">${WRITE.map((x,i) => `<button class="chip" data-act="wTask" data-i="${i}" aria-pressed="${i === ui.wTask}">Aufgabe ${String.fromCharCode(65+i)}</button>`).join("")}</div>
      <div class="text-src">${esc(wt.t)}</div>
      <p class="small muted">Schreiben Sie zu allen Punkten mindestens einen Satz. Denken Sie an Anrede und Gruß. Etwa 60–80 Wörter.</p>
      <label for="wTxt">Ihr Text</label><textarea id="wTxt" data-input="wc" placeholder="${esc(wt.gr)} …">${esc(ui.wText || "")}</textarea>
      <div class="row between"><span class="small muted" id="wc">${wc(ui.wText)} Wörter</span>
      <button class="btn" data-act="wFeedback" ${aiState !== "ok" || ui.wBusy ? "disabled" : ""}>${ui.wBusy ? "Wird geprüft …" : "KI-Feedback holen"}</button></div>
      ${aiState !== "ok" ? `<p class="small muted">${aiBadge()} Ohne KI: Prüfen Sie selbst mit der Checkliste.</p>` : ""}
      <div id="wOut" class="md">${ui.wfb ? md(ui.wfb) : ""}</div>
      <details><summary>Checkliste zum Selbstprüfen</summary><ul class="small"><li>Habe ich alle vier Punkte bearbeitet?</li><li>Anrede und Gruß: „Sehr geehrte …“ / „Mit freundlichen Grüßen“ oder „Liebe …“ / „Viele Grüße“?</li><li>Steht das Verb an Position 2? Im Nebensatz mit „weil“ am Ende?</li><li>Habe ich Datum oder Uhrzeit klar geschrieben?</li></ul></details></section>`;
  } else {
    body = `<section class="card"><span class="eyebrow">Sprechen · Teil 1</span><h2>Sich vorstellen</h2>
      <p>Erzählen Sie etwa eine Minute über sich. Diese Punkte helfen:</p>
      <div class="chips" style="flex-wrap:wrap">${["Name","Herkunft","Wohnort","Familie","Beruf / Arbeit","Sprachen","Hobbys"].map(x => `<span class="chip">${x}</span>`).join("")}</div>
      <p class="small muted">Danach fragt die Prüferin oft nach, z. B. „Warum lernen Sie Deutsch?“ – Sätze dazu finden Sie unter „Sätze“ → „Sich vorstellen“.</p></section>
    <section class="card"><span class="eyebrow">Sprechen · Teil 2</span><h2>Über ein Bild und Erfahrungen sprechen</h2>
      <div class="text-src">${esc(SPEAK2.bild)}</div>
      <ul>${SPEAK2.fragen.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      <button class="btn line" data-act="timer">${ui.timer ? `Läuft: ${fmt(ui.timeLeft)}` : "2 Minuten sprechen – Timer starten"}</button></section>
    <section class="card"><span class="eyebrow">Sprechen · Teil 3</span><h2>Gemeinsam etwas planen</h2>
      <div class="text-src">${esc(SPEAK3.aufgabe)}</div>
      <a class="btn" href="#gespraech" data-act="pickRp" data-id="pruefung">Mit KI-Partnerin üben</a>
      <p class="small muted">Die KI ist Ihre Partnerin in der Prüfung. Sprechen Sie Ihre Antwort laut und schreiben Sie sie dann auf.</p></section>`;
  }
  return head + `
  <p class="muted">Eigene Übungen im Stil des Deutsch-Tests für Zuwanderer. Keine Original-Prüfung und keine offizielle Bewertung.</p>
  <div class="grid2" role="group" aria-label="Prüfungsteil">${parts.map(([id,l]) => `<button class="tile" data-act="part" data-x="dtz" data-p="${id}" style="text-align:left;${ui.part === id ? "border:2px solid var(--accent)" : ""}"><span class="eyebrow">${l}</span><b>${S.done[id] || 0} %</b><span>${id === "lesen" || id === "hoeren" ? "bestes Ergebnis" : "Übungsfortschritt"}</span></button>`).join("")}</div>
  ${body}`;
};
function quiz(key, q, typ){
  const opts = typ === "rf" ? ["richtig","falsch"] : q[1];
  const right = typ === "rf" ? (q[1] ? 0 : 1) : q[2];
  const expl = typ === "rf" ? q[2] : q[3];
  const a = ui.answers[key];
  return `<div class="q"><b>${esc(q[0])}</b><div class="opts">${opts.map((o,i) => { let cls = ""; if(a !== undefined){ if(i === right) cls = "ok"; else if(i === a) cls = "no"; } return `<button class="${cls}" data-act="ans" data-k="${key}" data-i="${i}" ${a !== undefined ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>${a !== undefined && expl ? `<span class="small muted">${esc(expl)}</span>` : ""}</div>`;
}
function scoreLine(prefix, qs, typ, part){
  const n = qs.length; let done = 0, ok = 0;
  qs.forEach((q,i) => { const a = ui.answers[prefix+i]; if(a !== undefined){ done++; const right = typ === "rf" ? (q[1] ? 0 : 1) : q[2]; if(a === right) ok++; } });
  if(done < n) return `<p class="small muted">${done} von ${n} beantwortet</p>`;
  const pct = Math.round(ok / n * 100);
  if((S.done[part] || 0) < pct){ S.done[part] = pct; save(); }
  return `<div class="note row between"><span><b>${ok} von ${n} richtig</b> (${pct} %)</span><button class="btn sm line" data-act="resetQ" data-p="${prefix}">Nochmal</button></div>`;
}
const wc = t => (t || "").trim() ? t.trim().split(/\s+/).length : 0;
const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");

function lidView(){

  if(!L){
    const n = k => k === "alle" ? LID.length : LID.filter(q => q.k === k).length;
    return intro + `

      <div class="chips" style="flex-wrap:wrap">${[["alle","Alle Themen"]].concat(Object.entries(LID_CAT)).map(([k,l]) => `<button class="chip" data-act="lidCat" data-k="${k}" aria-pressed="${ui.lidCat === k}">${l} (${n(k)})</button>`).join("")}</div>
      <div class="row"><button class="btn" data-act="lidStart" data-n="10">10 Fragen</button><button class="btn line" data-act="lidStart" data-n="99">Alle Fragen</button></div></section>
    <div class="grid2"><div class="tile"><b>${S.done.lid || 0} %</b><span>bestes Ergebnis</span></div><div class="tile"><b>${LID.length}</b><span>Übungsfragen</span></div></div>`;
  }
  if(L.i >= L.set.length){
    const ok = L.set.filter((qi,i) => L.ans[i] === LID[qi].r).length, pct = Math.round(ok / L.set.length * 100);
    if((S.done.lid || 0) < pct){ S.done.lid = pct; save(); }
    const wrong = L.set.map((qi,i) => ({q:LID[qi], a:L.ans[i]})).filter(x => x.a !== x.q.r);
    return `<section class="card"><h2>${ok} von ${L.set.length} richtig</h2><div class="bar ${pct >= 50 ? "good" : "warn"}"><i style="width:${pct}%"></i></div>
      <p class="small muted">Zum Vergleich: Im echten Test brauchen Sie für den Orientierungskurs 15 von 33 richtigen Antworten, für die Einbürgerung 17.</p>
      <div class="row"><button class="btn" data-act="lidStart" data-n="${L.set.length}">Neue Runde</button><button class="btn line" data-act="lidEnd">Zur Übersicht</button></div></section>
      ${wrong.length ? `<section class="card"><h2>Das wiederholen</h2><div class="list">${wrong.map(x => `<div><b>${esc(x.q.q)}</b><br><span class="res-ok">${esc(x.q.o[x.q.r])}</span><br><span class="small muted">${esc(x.q.e)}</span></div>`).join("")}</div></section>` : ""}`;
  }
  const q = LID[L.set[L.i]], a = L.ans[L.i];
  return `<section class="card">
    <div class="row between"><span class="eyebrow">Frage ${L.i+1} von ${L.set.length} · ${LID_CAT[q.k]}</span>${spk(q.q + " " + q.o.join(". "))}</div>
    <div class="bar"><i style="width:${Math.round(L.i / L.set.length * 100)}%"></i></div>
    <h2>${esc(q.q)}</h2> ${trBtn(q.q + "\n" + q.o.map((o,i) => (i+1) + ". " + o).join("\n"))}
    <div class="q"><div class="opts">${q.o.map((o,i) => { let cls = ""; if(a !== undefined){ if(i === q.r) cls = "ok"; else if(i === a) cls = "no"; } return `<button class="${cls}" data-act="lidAns" data-i="${i}" ${a !== undefined ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div></div>
    ${a !== undefined ? `<div class="note">${a === q.r ? "<b>Richtig.</b> " : "<b>Nicht ganz.</b> "}${esc(q.e)}</div><button class="btn" data-act="lidNext">${L.i + 1 < L.set.length ? "Nächste Frage" : "Ergebnis ansehen"}</button>` : ""}
  </section>
  <button class="btn sm line" data-act="lidEnd" style="align-self:flex-start">Runde abbrechen</button>`;
}

function rpRules(sc){
  const lv = KURSARTEN[S.art].big && S.stage === "basis" ? "Alpha" : lvNow();
  return `Du bist Gesprächspartner in einem Rollenspiel in einem Integrationskurs (Deutsch als Zweitsprache, Erwachsene, BAMF).
Niveau der lernenden Person: ${lv}. Kursart: ${KURSARTEN[S.art].l}.
Deine Rolle: ${sc.ai}. Rolle der lernenden Person: ${sc.me}. Gesprächsziel der lernenden Person: ${sc.ziel}.
Regeln: Antworte nur auf Deutsch und bleib immer in deiner Rolle. Schreibe 1 bis 2 kurze Sätze, so wie man spricht. Sprache: ${levelRule(lv)} Sei freundlich und geduldig. Stelle eine Rückfrage, damit die lernende Person das Ziel selbst erreichen muss. Keine Regieanweisungen, keine Emojis, keine Erklärungen außerhalb der Rolle.
Wenn die letzte Äußerung der lernenden Person einen deutlichen Fehler enthält, schreibe nach deiner Antwort eine neue Zeile, die mit "TIPP:" beginnt, und nenne in einem kurzen, einfachen Satz die richtige Formulierung. Sonst keine TIPP-Zeile.`;
}
function transcript(sc){ return ui.rp.msgs.filter(x => !x.live).map(x => (x.who === "ai" ? sc.ai.split(",")[0] : "Lernende Person") + ": " + x.text).join("\n"); }
async function rpSend(){
  const inp = $("#rpIn"); const text = (inp && inp.value || "").trim(); if(!text || ui.rp.busy) return;
  const sc = findSc(ui.rp.id);
  ui.rp.msgs.push({who:"me", text}); ui.rp.busy = true;
  const prompt = rpRules(sc) + "\n\nBisheriges Gespräch:\n" + transcript(sc) + "\n\nAntworte jetzt in deiner Rolle auf die letzte Äußerung. Ist das Gesprächsziel erreicht, beende das Gespräch freundlich in deiner Rolle.";
  const live = {who:"ai", text:"…", live:true}; ui.rp.msgs.push(live); render();
  try{
    const out = await askAI(prompt, t => { const el = document.querySelector("#live .tx"); if(el) el.textContent = t.split(/\n?TIPP:/)[0]; });
    const [ans, tip] = out.split(/\n?TIPP:/);
    live.text = ans.trim(); if(tip) live.tip = tip.trim(); delete live.live; tick();
  }catch(e){ ui.rp.msgs.pop(); toast(aiErr(e)); }
  ui.rp.busy = false; render(); const ni = $("#rpIn"); if(ni) ni.focus();
}
async function rpFeedback(){

Situation: ${sc.t}. Rolle: ${sc.me}. Ziel: ${sc.ziel}.

Gespräch:
${transcript(sc)}

Antworte auf Deutsch, freundlich, in einfacher Sprache auf Niveau ${lvNow()}, in Markdown mit diesen Abschnitten (### Überschriften):
### Ziel erreicht?
Ein Satz.
### Das war gut
2 Punkte als Liste.
### So sagt man es besser
Bis zu 3 Punkte: Ihr Satz → besserer Satz.
### Sätze für das nächste Mal
3 kurze Sätze als Liste.
Keine Noten, keine Punkte.${lang}`;
  try{ ui.rp.fb = await askAI(prompt, t => { ui.rp.fb = t; const el = $("#rpFb"); if(el) el.innerHTML = md(t); }); S.done.sprechen = Math.min(100, (S.done.sprechen || 0) + 10); tick(); save(); }

VIEWS.kurs = () => {

  const keys = isO ? ["w","l","h","s","sp","lid"] : ["w","l","h","s","sp"];
  const avg = p => Math.round(keys.reduce((a,k) => a + p[k], 0) / keys.length);
  const st = v => v >= 70 ? ["good","auf Kurs"] : v >= 50 ? ["warn","beobachten"] : ["crit","Unterstützung"];
  const tn = c ? c.tn : [];
  const mean = tn.length ? Math.round(tn.reduce((a,p) => a + avg(p), 0) / tn.length) : 0;
  const need = tn.filter(p => avg(p) < 50).length;
  const lowAn = tn.filter(p => p.an < 80).length;
  const partAvg = k => tn.length ? Math.round(tn.reduce((a,p) => a + p[k], 0) / tn.length) : 0;
  const pl = [["l","Lesen"],["h","Hören"],["s","Schreiben"],["sp","Sprechen"]].concat(isO ? [["lid","Leben in D."]] : []);
  const weak = pl.slice().sort((a,b) => partAvg(a[0]) - partAvg(b[0]))[0];
  const tasks = S.tasks.filter(t => c && t.course === c.id);
  return `
  <div class="row between"><h1>Meine Kurse</h1><span class="pill lv">Beispieldaten</span></div>
  <div class="chips">${S.courses.map(x => `<button class="chip" data-act="course" data-id="${x.id}" aria-pressed="${c && x.id === c.id}">${esc(x.name)}</button>`).join("")}<button class="chip" data-act="newCourse">+ Kurs anlegen</button></div>
  ${ui.newCourse ? `<section class="card"><h2>Neuer Kurs</h2>
    <label for="ncName">Kursname<input type="text" id="ncName" placeholder="z. B. IK Modul 5 · Nachmittag"></label>
    <div class="grid2"><label for="ncSt">Kursabschnitt<select id="ncSt">${Object.entries(STAGES).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join("")}</select></label>
    <label for="ncArt">Kursart<select id="ncArt">${Object.entries(KURSARTEN).map(([k,v]) => `<option value="${k}">${esc(v.l)}</option>`).join("")}</select></label></div>
    <label for="ncInfo">Zeiten / Format<input type="text" id="ncInfo" placeholder="z. B. Mo–Fr 8:30–12:45 · Präsenz"></label>
    <div class="row"><button class="btn" data-act="saveCourse">Kurs anlegen</button><button class="btn line" data-act="newCourse">Abbrechen</button></div></section>` : ""}
  ${c ? `
  <section class="card hero"><span class="eyebrow">${esc(STAGES[c.stage].label)} · ${esc(modLabel(c.stage, c.art))} · ${esc(KURSARTEN[c.art].s)}</span><h2>${esc(c.name)}</h2><p class="muted">${esc(c.info || "")}</p></section>
  <div class="grid3"><div class="tile"><b>${tn.length}</b><span>Teilnehmende</span></div><div class="tile"><b>${mean} %</b><span>Ø Fortschritt</span></div><div class="tile"><b style="color:${need ? "var(--crit)" : "inherit"}">${need}</b><span>brauchen Unterstützung</span></div></div>
  ${tn.length ? `<div class="note">Schwächster Bereich im Kurs: <b>${weak[1]}</b> (Ø ${partAvg(weak[0])} %).${lowAn ? ` ${lowAn} Teilnehmende mit Anwesenheit unter 80 % – bitte Fehlzeiten im Blick behalten.` : ""} Passendes Material erstellen Sie unter „Material“.</div>` : ""}
  <section class="card"><h2>Lernstand</h2>
    ${tn.length ? `<div class="tbl"><table><thead><tr><th>Name</th><th>Wörter</th><th>Hören</th><th>Lesen</th><th>Schreiben</th><th>Sprechen</th>${isO ? "<th>LiD</th>" : ""}<th>Anwesend</th><th>Aktiv</th><th>Status</th></tr></thead><tbody>
    ${tn.slice().sort((a,b) => avg(a) - avg(b)).map(p => { const s = st(avg(p)); return `<tr><td><b>${esc(p.n)}</b></td><td><span class="bar ${st(p.w)[0]}"><i style="width:${p.w}%"></i></span>${p.w}</td><td>${p.h}</td><td>${p.l}</td><td>${p.s}</td><td>${p.sp}</td>${isO ? `<td>${p.lid}</td>` : ""}<td style="color:${p.an < 80 ? "var(--crit)" : "inherit"}">${p.an} %</td><td class="muted">${esc(p.last)}</td><td><span class="pill ${s[0]}">${s[1]}</span></td></tr>`; }).join("")}
    </tbody></table></div>` : `<p class="muted">Noch keine Teilnehmenden in diesem Kurs.</p>`}
    <div class="row"><input type="text" id="tnName" placeholder="Name oder Kürzel hinzufügen" style="flex:1;min-width:160px" aria-label="Name"><button class="btn sm ghost" data-act="addTn">Hinzufügen</button></div>
    <p class="small muted">Tipp zum Datenschutz: Im Prototyp nur Vorname und Initial oder ein Kürzel verwenden.</p>
  </section>
  <section class="card"><h2>Aufgaben verteilen</h2>
    ${tasks.length ? `<div class="list">${tasks.map(t => `<div class="row between"><span><b>${esc(t.t)}</b><br><span class="small muted">fällig bis ${new Date(t.due).toLocaleDateString("de-DE")}</span></span><button class="btn sm line" data-act="delTask" data-i="${S.tasks.indexOf(t)}">Entfernen</button></div>`).join("")}</div>` : `<p class="muted small">Noch keine Aufgaben für diesen Kurs.</p>`}
    <div class="grid2"><label for="tkSel">Aufgabe<select id="tkSel">${taskOptions(c).map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select></label>
    <label for="tkDue">Fällig bis<input type="date" id="tkDue" value="${new Date(Date.now()+5*864e5).toISOString().slice(0,10)}"></label></div>
    <button class="btn" data-act="addTask">Aufgabe zuweisen</button>
    <p class="small muted">Im Prototyp erscheinen Aufgaben auf diesem Gerät unter „Lernen“, wenn dort derselbe Kursabschnitt eingestellt ist.</p>
  </section>` : ""}`;
};
function taskOptions(c){
  const o = Object.entries(DECKS).map(([k,l]) => ["woerter:" + k + "|Wortschatz-Runde: " + l, "Wortschatz-Runde: " + l]);
  SCENARIOS.forEach(s => o.push(["gespraech:" + s.id + "|Gespräch: " + s.t, "Gespräch: " + s.t]));
  o.push(["gespraech:pruefung|DTZ Sprechen Teil 3 üben", "DTZ Sprechen Teil 3 üben"]);
  ["Hören","Lesen","Schreiben"].forEach(p => o.push(["pruefung:" + p.toLowerCase().replace("ö","oe") + "|DTZ-Training " + p, "DTZ-Training " + p]));
  o.push(["pruefung:lid|Übungsfragen Leben in Deutschland", "Übungsfragen Leben in Deutschland"]);
  return o;
}

/* ---------- Lehrkräfte: Material ---------- */
const MAT_FIELDS = ["Ämter und Behörden","Arbeit","Arbeitssuche","Aus- und Weiterbildung","Banken und Versicherungen","Betreuung und Ausbildung der Kinder","Einkaufen","Gesundheit","Mediennutzung","Mobilität","Unterricht","Wohnen","Umgang mit Konflikten","Interkulturelle Kompetenz","Orientierungskurs: Politik in der Demokratie","Orientierungskurs: Geschichte und Verantwortung","Orientierungskurs: Mensch und Gesellschaft"];
const FIELD_DECK = {"Ämter und Behörden":"aemter","Arbeit":"arbeit","Arbeitssuche":"arbeit","Betreuung und Ausbildung der Kinder":"kinder","Einkaufen":"einkaufen","Gesundheit":"gesundheit","Mediennutzung":"medien","Mobilität":"mobil","Wohnen":"wohnen"};
VIEWS.material = () => {
  const m = ui.mat || {typ:"Lückentext", f:"Wohnen", lv:lvNow(), art:S.art, extra:""};
  ui.mat = m;
  const TYPES = ["Lückentext","Dialog mit Rollenkarten","Wortschatzübung (Zuordnung)","Schreibaufgabe im DTZ-Stil","Lesetext mit Fragen","Hörtext-Skript mit Fragen","Übungsfragen Orientierungskurs","Alpha-Blatt (Anlaute, Silben, große Schrift)"];
  const dk = FIELD_DECK[m.f];
  return `
  <div class="row between"><h1>Material erstellen</h1>${aiBadge()}</div>
  <p class="muted">Arbeitsblätter nach Handlungsfeldern des Rahmencurriculums, passend zu Niveau und Kursart. Mit Lösungen, zum Kopieren in Ihre Unterlagen.</p>
  <section class="card">
    <div class="grid2">
      <label for="mTyp">Übungstyp<select id="mTyp" data-m="typ">${TYPES.map(t => `<option ${t === m.typ ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label for="mF">Handlungsfeld<select id="mF" data-m="f">${MAT_FIELDS.map(v => `<option ${v === m.f ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label for="mLv">Niveau<select id="mLv" data-m="lv">${["Alpha","A1","A2","B1"].map(l => `<option ${l === m.lv ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label for="mArt">Kursart<select id="mArt" data-m="art">${Object.entries(KURSARTEN).map(([k,v]) => `<option value="${k}" ${k === m.art ? "selected" : ""}>${esc(v.l)}</option>`).join("")}</select></label>
    </div>
    <label for="mEx">Zusatzwunsch (optional)<input type="text" id="mEx" data-m="extra" value="${esc(m.extra)}" placeholder="z. B. Fokus trennbare Verben, 20 Minuten, Partnerarbeit, Lingen als Ort"></label>
    <div class="row"><button class="btn" data-act="genMat" ${aiState !== "ok" || ui.matBusy ? "disabled" : ""}>${ui.matBusy ? "Wird erstellt …" : "Mit KI erstellen"}</button>
    <button class="btn line" data-act="localGap" ${dk ? "" : "disabled"}>Ohne KI: Lückentext aus Wortschatz</button></div>
    ${dk ? "" : `<p class="small muted">Der Lückentext ohne KI gibt es für Handlungsfelder mit eigenem Wortschatz-Deck.</p>`}
  </section>
  ${ui.matOut ? `<section class="card"><div class="row between"><h2>Arbeitsblatt</h2><button class="btn sm ghost" data-act="copyMat">Kopieren</button></div><div class="md" id="matOut">${md(ui.matOut)}</div></section>` : ""}
  <section class="card"><h2>Eigenen Wortschatz ergänzen</h2>
    <p class="small muted">Wörter aus Ihrem Unterricht oder Ihrer Stadt. Sie erscheinen sofort in den Karteikarten.</p>
    <div class="grid2">
      <label for="cvW">Wort<input type="text" id="cvW" placeholder="z. B. Wertstoffhof"></label>
      <label for="cvA">Artikel<select id="cvA"><option value="der">der</option><option value="die">die</option><option value="das">das</option><option value="">kein Nomen</option></select></label>
      <label for="cvP">Plural<input type="text" id="cvP" placeholder="z. B. die Wertstoffhöfe"></label>
      <label for="cvD">Thema<select id="cvD">${Object.entries(DECKS).map(([k,v]) => `<option value="${k}" ${k === S.deck ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>
    </div>
    <label for="cvS">Beispielsatz<input type="text" id="cvS" placeholder="Alte Möbel bringe ich zum Wertstoffhof."></label>
    <label for="cvE">Erklärung in einfacher Sprache<input type="text" id="cvE" placeholder="Ort, wo man Müll und alte Sachen abgibt."></label>
    <button class="btn" data-act="addWord">Wort hinzufügen</button>
    ${S.custom.length ? `<p class="small muted">Eigene Wörter: ${S.custom.map(c => esc((c.a ? c.a + " " : "") + c.w)).join(", ")}</p>` : ""}
  </section>`;
};
async function genMat(){
  const m = ui.mat; ui.matBusy = true; ui.matOut = "Arbeitsblatt wird erstellt …"; render();
  const dk = FIELD_DECK[m.f];
  const words = dk ? deckWords(dk).map(w => (w.a ? w.a + " " : "") + w.w).join(", ") : "";
  const prompt = `Erstelle ein Arbeitsblatt für einen Integrationskurs (BAMF, Deutsch als Zweitsprache, Erwachsene).
Übungstyp: ${m.typ}. Niveau: ${m.lv}. Kursart: ${KURSARTEN[m.art].l}. Handlungsfeld (Rahmencurriculum): ${m.f}.
${words ? "Nutze nach Möglichkeit diesen Wortschatz: " + words + "." : ""}
${m.extra ? "Zusatzwunsch der Lehrkraft: " + m.extra : ""}
Sprachniveau der Texte: ${levelRule(m.lv)}
Anforderungen: realistische Alltagssituation in Deutschland; klare, kurze Arbeitsanweisung in der Sie-Form; 6 bis 10 Items; respektvolle, vielfältige Namen und Situationen ohne Klischees. ${m.typ.startsWith("Übungsfragen") ? "Nur sachlich korrekte Fragen mit je 3 Antworten, genau eine richtig; keine Fragen aus dem amtlichen Katalog wörtlich übernehmen." : ""} ${m.typ.startsWith("Alpha") ? "Für Alphabetisierung: große, einfache Wörter, Silben mit Bindestrich trennen, Anlaut-Übungen, keine langen Texte." : ""}
Am Ende ein Abschnitt "### Lösungen" und ein Abschnitt "### Hinweise für die Lehrkraft" mit 2 bis 3 Stichpunkten (Sozialform, Zeit, Differenzierung).
Formatiere in Markdown mit Überschriften (###), Listen und Lücken als ______. Keine Einleitung vor dem Arbeitsblatt.`;
  try{ ui.matOut = await askAI(prompt, x => { ui.matOut = x; const el = $("#matOut"); if(el) el.innerHTML = md(x); }); }
  catch(e){ ui.matOut = null; toast(aiErr(e)); }
  ui.matBusy = false; render();
}
function localGap(){
  const dk = FIELD_DECK[ui.mat.f]; if(!dk) return;
  const items = deckWords(dk).filter(w => w.a).map(w => { const re = new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "[a-zäöüß]*", "i"); return re.test(w.s) ? {w, s:w.s.replace(re, "______")} : null; }).filter(Boolean);
  const box = items.map(i => i.w.w).sort().join(" · ");
  ui.matOut = `### Lückentext: ${DECKS[dk]}\nSchreiben Sie das passende Wort in die Lücke.\n\n**Wörter:** ${box}\n\n` + items.map((i,n) => `- ${n+1}. ${i.s}`).join("\n") + `\n\n### Lösungen\n` + items.map((i,n) => `- ${n+1}. ${i.w.a} ${i.w.w} (${i.w.pl})`).join("\n");
  render();
}

/* ---------- Einstellungen ---------- */
function openSettings(){
  $("#sheet").innerHTML = `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Kurs einstellen">
    <div class="row between"><h2>Kurs einstellen</h2><button class="btn sm line" data-act="closeSheet">Fertig</button></div>
    <div><span class="eyebrow">Kursabschnitt</span><div class="opt">${Object.entries(STAGES).map(([k,v]) => `<button data-act="setSt" data-v="${k}" aria-pressed="${k === S.stage}"><b>${v.label}</b><br><span class="small muted">${esc(modLabel(k))} · ${v.note}</span></button>`).join("")}</div></div>
    <div><span class="eyebrow">Kursart</span><div class="opt">${Object.entries(KURSARTEN).map(([k,v]) => `<button data-act="setArt" data-v="${k}" aria-pressed="${k === S.art}">${esc(v.l)}</button>`).join("")}</div>
    <p class="small muted">Bei Alpha- und Zweitschriftkursen wird die Schrift größer und das Vorlesen langsamer.</p></div>
    <div><span class="eyebrow">Hilfesprache</span><div class="opt">${LANGS.map(l => `<button data-act="setLang" data-v="${esc(l)}" aria-pressed="${l === S.lang}">${esc(l)}</button>`).join("")}</div>
    <p class="small muted">Mit Hilfesprache können Sie Wörter, Sätze und KI-Antworten übersetzen lassen (nur mit KI).</p></div>
    <button class="btn line sm" data-act="resetAll">Fortschritt auf diesem Gerät zurücksetzen</button>
  </div></div>`;
}

/* ---------- Aktionen ---------- */
const ACT = {
  openSettings, closeSheet(){ $("#sheet").innerHTML = ""; },
  setSt(b){ S.stage = b.dataset.v; ui.answers = {}; ui.wfb = null; if(S.stage === "orient") ui.exam = "lid"; save(); openSettings(); render(); },
  setArt(b){ S.art = b.dataset.v; save(); openSettings(); render(); },
  setLang(b){ S.lang = b.dataset.v; save(); openSettings(); render(); },
  resetAll(){ const keep = S.role; S = defaults(); S.role = keep; save(); ui.queue = null; $("#sheet").innerHTML = ""; toast("Fortschritt zurückgesetzt"); render(); },
  role(b){ S.role = b.dataset.v; save(); ui.rp = null; location.hash = NAV[S.role][0][0]; render(); },
  hideHint(){ S.hint = false; save(); render(); },
  speak(b){ speak(b.dataset.t); }, copy(b){ copy(b.dataset.t); }, trans(b){ translate(b.dataset.t); },
  deck(b){ ui.deck = b.dataset.b; S.deck = b.dataset.b; save(); ui.queue = null; render(); },
  art(b){ ui.pick = b.dataset.a; ui.phase = "show"; const w = ui.queue[ui.qi]; if(KURSARTEN[S.art].big && w) speak(w.a + " " + w.w + ". " + w.s); render(); },
  reveal(){ ui.phase = "show"; render(); },
  next(b){ const d = ui.deck || S.deck; grade(d, ui.queue[ui.qi], b.dataset.ok === "1"); ui.qi++; ui.phase = "ask"; ui.pick = null; render(); },
  practiceAll(){ const d = ui.deck || S.deck; ui.queue = deckWords(d).slice().sort(() => Math.random() - .5); ui.qi = 0; ui.phase = "ask"; render(); },
  field(b){ ui.field = b.dataset.f; render(); }, allLv(){ ui.allLv = !ui.allLv; render(); },
  exam(b){ ui.exam = b.dataset.x; render(); },
  part(b){ ui.exam = b.dataset.x || "dtz"; if(b.dataset.p !== "lid") ui.part = b.dataset.p; if(location.hash !== "#pruefung") return; render(); },
  ans(b){ ui.answers[b.dataset.k] = +b.dataset.i; tick(); render(); },
  resetQ(b){ Object.keys(ui.answers).forEach(k => { if(k.startsWith(b.dataset.p)) delete ui.answers[k]; }); render(); },
  toggleTr(b){ ui.tr[b.dataset.i] = !ui.tr[b.dataset.i]; render(); },
  wTask(b){ ui.wTask = +b.dataset.i; ui.wfb = null; render(); },
  timer(){ if(ui.timer){ clearInterval(ui.timer); ui.timer = null; render(); return; } ui.timeLeft = 120; ui.timer = setInterval(() => { ui.timeLeft--; const b = document.querySelector('[data-act="timer"]'); if(b) b.textContent = "Läuft: " + fmt(ui.timeLeft); if(ui.timeLeft <= 0){ clearInterval(ui.timer); ui.timer = null; toast("Zeit vorbei. Gut gemacht!"); render(); } }, 1000); render(); },
  lidCat(b){ ui.lidCat = b.dataset.k; render(); },
  lidStart(b){ const pool = LID.map((q,i) => i).filter(i => ui.lidCat === "alle" || LID[i].k === ui.lidCat).sort(() => Math.random() - .5); ui.lid = {set:pool.slice(0, +b.dataset.n), i:0, ans:[]}; render(); },
  lidAns(b){ ui.lid.ans[ui.lid.i] = +b.dataset.i; tick(); render(); },
  lidNext(){ ui.lid.i++; render(); window.scrollTo(0,0); },
  lidEnd(){ ui.lid = null; render(); },
  wFeedback, rpSend, rpFeedback,
  pickRp(b){ const sc = findSc(b.dataset.id); if(!sc) return; ui.rp = {id:sc.id, msgs:[{who:"ai", text:sc.open}], busy:false, fb:null}; if(location.hash !== "#gespraech") return; render(); },
  rpBack(){ ui.rp = null; render(); },
  openTask(b){ const [r, x] = b.dataset.k.split(":");
    if(r === "gespraech"){ const sc = findSc(x); if(sc) ui.rp = {id:sc.id, msgs:[{who:"ai", text:sc.open}], busy:false, fb:null}; }
    if(r === "woerter" && x){ ui.deck = x; S.deck = x; ui.queue = null; save(); }
    if(r === "pruefung" && x){ if(x === "lid") ui.exam = "lid"; else { ui.exam = "dtz"; ui.part = x; } }
    if(location.hash === "#" + r) render(); },
  course(b){ S.course = b.dataset.id; save(); render(); },
  newCourse(){ ui.newCourse = !ui.newCourse; render(); },
  saveCourse(){ const n = $("#ncName").value.trim(); if(!n){ toast("Bitte einen Kursnamen eingeben."); return; } const c = {id:"c" + Date.now(), name:n, stage:$("#ncSt").value, art:$("#ncArt").value, info:$("#ncInfo").value.trim(), tn:[]}; S.courses.push(c); S.course = c.id; ui.newCourse = false; save(); render(); },
  addTn(){ const n = $("#tnName").value.trim(); if(!n) return; const c = S.courses.find(x => x.id === S.course) || S.courses[0]; c.tn.push({n, w:0, l:0, h:0, s:0, sp:0, lid:0, an:100, last:"noch nicht aktiv"}); save(); render(); },
  addTask(){ const c = S.courses.find(x => x.id === S.course) || S.courses[0]; const [kind, t] = $("#tkSel").value.split("|"); S.tasks.push({t, course:c.id, due:$("#tkDue").value || today(), kind}); save(); toast("Aufgabe zugewiesen"); render(); },
  delTask(b){ S.tasks.splice(+b.dataset.i, 1); save(); render(); },
  genMat, localGap, copyMat(){ copy(ui.matOut || ""); },
  addWord(){ const w = $("#cvW").value.trim(), s = $("#cvS").value.trim(); if(!w || !s){ toast("Bitte Wort und Beispielsatz eingeben."); return; } S.custom.push({w, a:$("#cvA").value, pl:$("#cvP").value.trim() || "–", s, e:$("#cvE").value.trim() || "", d:$("#cvD").value, own:true}); save(); toast("Wort hinzugefügt"); render(); }
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(!b) return; const f = ACT[b.dataset.act]; if(!f) return; if(b.tagName === "BUTTON") e.preventDefault(); if(b.classList.contains("sheet-bg") && e.target !== b) return; f(b, e); });
document.addEventListener("input", e => {
  if(e.target.dataset.input === "wc"){ ui.wText = e.target.value; const el = $("#wc"); if(el) el.textContent = wc(ui.wText) + " Wörter"; }
  if(e.target.dataset.m){ ui.mat[e.target.dataset.m] = e.target.value; }
});
document.addEventListener("change", e => { if(e.target.dataset.m){ ui.mat[e.target.dataset.m] = e.target.value; if(e.target.dataset.m === "f") render(); } });
document.addEventListener("keydown", e => { if(e.target.id === "rpIn" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); rpSend(); } });
window.addEventListener("hashchange", () => { window.scrollTo(0,0); render(); });
if(S.stage === "orient") ui.exam = "lid";
render();
</script>
</body>
</html>
